name: Security CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CI: "true"

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: "11.25.0"
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository security checks
        run: pnpm run security:check

      - name: Validate Android release configuration
        run: pnpm run android:check

      - name: Validate Google Play metadata and assets
        run: pnpm run play:check

      - name: Validate database migrations
        run: pnpm exec drizzle-kit check

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Type-check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build production artifact
        run: pnpm run build
